version: 2
updates:
  - package-ecosystem: gomod
    directory: /go-b2b-starter
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    groups:
      postgres-driver:
        patterns: ["github.com/jackc/*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /next_b2b_starter
    schedule: {interval: weekly}
    open-pull-requests-limit: 8
    versioning-strategy: increase
    # These majors require the coordinated migrations in docs/decisions/0002-frontend-tooling.md.
    # Leave ESLint major proposals visible: the retained v9 line is already EOL.
    ignore:
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwind-merge
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      next-react:
        patterns: [next, eslint-config-next, react, react-dom, "@types/react", "@types/react-dom"]
        update-types: [minor, patch]
      radix:
        patterns: ["@radix-ui/*"]
        update-types: [minor, patch]
      better-auth:
        patterns: [better-auth, "@better-auth/*"]
        update-types: [minor, patch]
      css-tooling:
        patterns: [tailwindcss, tailwind-merge, tailwindcss-animate, postcss, autoprefixer]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /tests/browser
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    versioning-strategy: increase
  - package-ecosystem: docker
    directory: /go-b2b-starter
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /next_b2b_starter
    schedule: {interval: weekly}
  - package-ecosystem: docker-compose
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
