name: Verify developer harness
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  harness:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - run: node scripts/harness.mjs check
      - run: node --test scripts/harness.test.mjs scripts/mcp-probe.test.mjs
