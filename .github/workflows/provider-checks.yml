name: Provider verification contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: provider-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  provider-check-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - run: node --test next_b2b_starter/scripts/check-providers.test.mjs
      - run: node --test scripts/billing-environment.test.mjs
