name: Scheduled dependency audit
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/dependency-audit.yml'
      - '.github/dependabot.yml'
permissions:
  contents: read
concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: go-b2b-starter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-b2b-starter/go.mod
          cache-dependency-path: go-b2b-starter/go.sum
      - run: go mod download && go mod verify
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: next_b2b_starter/pnpm-lock.yaml
      - run: pnpm --dir next_b2b_starter install --frozen-lockfile
      - name: Audit application and development dependencies
        run: pnpm --dir next_b2b_starter audit --audit-level=high
      - run: npm ci --prefix tests/browser
      - name: Audit browser tooling
        run: npm audit --prefix tests/browser --audit-level=high
