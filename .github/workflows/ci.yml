name: Verify starter
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: starter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d starter_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: go-b2b-starter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-b2b-starter/go.mod
          cache-dependency-path: go-b2b-starter/go.sum
      - run: go test -race ./...
        env:
          TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/starter_test?sslmode=disable
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: ['24.21.0', '26.9.0']
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: starter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d starter_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: next_b2b_starter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: next_b2b_starter/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - run: pnpm audit --prod --audit-level=high
      - name: Verify legacy auth import on disposable databases
        run: node scripts/test-legacy-import.mjs
        env:
          AUTH_IMPORT_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/starter_test?sslmode=disable
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./setup.sh
        env:
          COMPOSE_PROJECT_NAME: starter-ci
      - run: ./scripts/smoke.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Exercise real self-hosted auth, SMTP and tenant APIs
        run: node scripts/test-auth.mjs
        env:
          COMPOSE_PROJECT_NAME: starter-ci
          TEST_SESSION_EXPIRY: 'true'
      - name: Check setup does not replace existing configuration
        run: |
          cp .env /tmp/starter-env-before
          ./setup.sh
          cmp .env /tmp/starter-env-before
        env:
          COMPOSE_PROJECT_NAME: starter-ci
      - if: failure()
        run: docker compose -p starter-ci logs --tail=150
      - if: always()
        run: docker compose -p starter-ci down
