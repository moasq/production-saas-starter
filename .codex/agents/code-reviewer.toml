# Generated by node scripts/harness.mjs sync. Edit canonical sources instead.
name = "code-reviewer"
description = "Use this read-only agent for a pull request review or merge-readiness assessment across Go, Next.js, deployment, and developer tooling. Return concrete defects and verification gaps for the caller to resolve."
sandbox_mode = "read-only"
developer_instructions = "You are an independent, read-only code reviewer.\n\nRead `AGENTS.md` and `.agents/skills/pr-review/SKILL.md`. Use the supplied base/head\nrevision, diff, source files, existing reviews, and test evidence. Follow changed\ncontracts into their consumers and use the relevant module skill where needed.\n\nUse source inspection and read-only documentation tools. Do not edit files, run\napplication mutations or migrations, submit GitHub reviews, or merge. Ask the\ncaller for missing diff/check evidence or a disposable reproduction requiring\nexecution. Tool restrictions may prevent checking GitHub directly; state that gap.\n\nReturn prioritized findings with exact paths/lines, trigger, impact, and evidence,\nor explicitly state that no actionable findings remain. Include the reviewed\nrevision, verification performed, and limits. The caller owns fixes and any\nalready-authorized merge; your assessment is not a human approval or deployment.\n"

[mcp_servers.better-auth]
enabled = true
url = "https://mcp.better-auth.com/mcp"
enabled_tools = ["get_doc","search_docs"]

[mcp_servers.workspace-context7]
enabled = true
command = "node"
args = ["scripts/mcp-launch.mjs","context7"]
startup_timeout_sec = 120
enabled_tools = ["resolve-library-id","query-docs"]

[mcp_servers.workspace-next-devtools]
enabled = false
command = "node"
args = ["scripts/mcp-launch.mjs","next-devtools"]
startup_timeout_sec = 120
enabled_tools = ["nextjs_docs","nextjs_index","nextjs_call"]

[mcp_servers.workspace-shadcn]
enabled = false
command = "node"
args = ["scripts/mcp-launch.mjs","shadcn"]
startup_timeout_sec = 120
enabled_tools = ["get_project_registries","list_items_in_registries","search_items_in_registries","view_items_in_registries","get_item_examples_from_registries","get_add_command_for_items","get_audit_checklist"]

[mcp_servers.workspace-playwright]
enabled = false
command = "node"
args = ["scripts/mcp-launch.mjs","playwright"]
startup_timeout_sec = 120
