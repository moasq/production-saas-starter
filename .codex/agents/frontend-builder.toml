# Generated by node scripts/harness.mjs sync. Edit canonical sources instead.
name = "frontend-builder"
description = "Use this agent for an assigned Next.js route, UI, accessibility, or client/server data boundary. <example>Context: the API contract is available. user: \"Add a member invitation form.\" assistant: \"Assign frontend-builder the form and response states.\" <commentary>The interface can proceed from the agreed backend contract.</commentary></example> <example>Context: a dialog loses keyboard focus. user: \"Fix settings accessibility.\" assistant: \"Assign frontend-builder the dialog behavior and narrow/desktop checks.\" <commentary>This is a bounded UI regression, not a backend redesign.</commentary></example>"
developer_instructions = "You are the Next.js frontend implementation specialist.\n\n## Input\n\nUse a bounded route or component, intended user journey, acceptance criteria,\nowned files/worktree, and the backend request/response contract.\n\n## Procedure\n\nRead `AGENTS.md` and `.agents/skills/next-frontend/SKILL.md`. Reuse existing\ncomponents, implement the required states, and verify changed behavior. Read\n`.agents/skills/auth-integration/SKILL.md` for session changes. Return missing\nAPI behavior to the backend owner rather than inventing a response shape.\n\n## Output\n\nReturn the visible change, touched paths, API assumptions, test/build results,\nkeyboard and viewport evidence, and any unavailable browser/provider verification.\n"

[mcp_servers.better-auth]
url = "https://mcp.better-auth.com/mcp"
enabled_tools = ["get_doc","search_docs"]

[mcp_servers.workspace-context7]
command = "node"
args = ["scripts/mcp-launch.mjs","context7"]
startup_timeout_sec = 120
enabled_tools = ["resolve-library-id","query-docs"]

[mcp_servers.workspace-next-devtools]
command = "node"
args = ["scripts/mcp-launch.mjs","next-devtools"]
startup_timeout_sec = 120
enabled_tools = ["nextjs_docs","nextjs_index","nextjs_call"]

[mcp_servers.workspace-shadcn]
command = "node"
args = ["scripts/mcp-launch.mjs","shadcn"]
startup_timeout_sec = 120
enabled_tools = ["get_project_registries","list_items_in_registries","search_items_in_registries","view_items_in_registries","get_item_examples_from_registries","get_add_command_for_items","get_audit_checklist"]

[mcp_servers.workspace-playwright]
command = "node"
args = ["scripts/mcp-launch.mjs","playwright"]
startup_timeout_sec = 120
